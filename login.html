<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display.swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #263238; /* Koyu tema arkaplan */
        }
        .login-container {
            background-color: #37474F;
            padding: 2.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .btn-login {
            background-color: #4FC3F7;
            color: #263238;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .btn-login:hover {
            background-color: #82B1FF;
        }
        input {
            background-color: #546E7A;
            color: #ECEFF1;
            border-color: #455A64;
        }
        input::placeholder {
            color: #90A4AE;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div class="login-container">
        <h1 class="text-3xl font-bold text-center text-white mb-6">Pano Yönetim Girişi</h1>

        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-gray-300 mb-2">E-posta Adresi</label>
                <input type="email" id="email" class="w-full px-4 py-2 rounded border focus:outline-none focus:ring-2 focus:ring-blue-400" required placeholder="admin@okul.com">
            </div>

            <div class="mb-6">
                <label for="password" class="block text-gray-300 mb-2">Şifre</label>
                <input type="password" id="password" class="w-full px-4 py-2 rounded border focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <button type="submit" class="w-full btn-login py-2 rounded">Giriş Yap</button>
        </form>

        <p id="error-message" class="text-red-400 text-center mt-4"></p>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
