<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firebase Login Test</title>
</head>
<body>
    <h1>Firebase Authentication Test</h1>
    <button id="google-login-btn">Test Google Login</button>
    <p id="status">Status: Waiting for action...</p>

    <script type="module">
        // Import functions from the Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAFSO4FH_rcXSvUYNn60Yph-EQeWLzWac0",
          authDomain: "datacek-91963.firebaseapp.com",
          projectId: "datacek-91963",
          storageBucket: "datacek-91963.appspot.com",
          messagingSenderId: "45310934263",
          appId: "1:45310934263:web:32d11f85ca005ed8f627f2"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const googleLoginBtn = document.getElementById('google-login-btn');
        const statusElement = document.getElementById('status');

        googleLoginBtn.addEventListener('click', () => {
            statusElement.textContent = 'Attempting to sign in with Google...';
            const provider = new GoogleAuthProvider();

            signInWithPopup(auth, provider)
                .then((result) => {
                    // This gives you a Google Access Token. You can use it to access the Google API.
                    const credential = GoogleAuthProvider.credentialFromResult(result);
                    const token = credential.accessToken;
                    // The signed-in user info.
                    const user = result.user;
                    console.log("Success!", user);
                    statusElement.textContent = `Success! Logged in as ${user.displayName} (${user.email})`;
                    statusElement.style.color = 'green';
                }).catch((error) => {
                    // Handle Errors here.
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Login Failed:", error);
                    statusElement.textContent = `Login Failed! Error: ${errorCode} - ${errorMessage}`;
                    statusElement.style.color = 'red';
                });
        });
    </script>
</body>
</html>
